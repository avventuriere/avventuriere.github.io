name: Generate website content

on:
  push:
    branches:
      - master
    paths:
      - "markdown_generator/**"
      - ".github/workflows/generate-content.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-content-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SITE_GENERATOR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: markdown_generator/requirements.txt

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r markdown_generator/requirements.txt

      - name: Generate publication and talk pages
        working-directory: markdown_generator
        run: |
          python papers.py
          python talks.py

      - name: Commit generated Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A _publications _manuscripts _dissertation _talks

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate website content"
            git push
          fi
